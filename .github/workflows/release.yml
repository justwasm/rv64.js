name: rv64.js and WANIX release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing semver tag to publish
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: rv64-wanix-release-${{ github.event.inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare-release:
    name: Create semver release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Validate and create release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          release_tag="${{ github.event.inputs.release_tag || github.ref_name }}"
          if [[ ! "$release_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "tag must be an exact semver such as v0.1.0" >&2
            exit 2
          fi
          if ! gh release view "$release_tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$release_tag" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --generate-notes \
              --title "rv64.js and WANIX $release_tag"
          else
            # Pushing a semver tag auto-creates a draft release on GitHub. If
            # that auto-draft exists, promote it to published so downstream
            # upload steps see a fully realised release record. Without this,
            # gh release upload from jobs that run in parallel can race the
            # release-record visibility and report "release not found".
            if gh release view "$release_tag" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft' | grep -q true; then
              gh release edit "$release_tag" \
                --repo "$GITHUB_REPOSITORY" \
                --draft=false
            fi
          fi

  build-library:
    name: Build rv64.js library
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Validate release tag
        shell: bash
        run: |
          release_tag="${{ github.event.inputs.release_tag || github.ref_name }}"
          if [[ ! "$release_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "tag must be an exact semver such as v0.1.0" >&2
            exit 2
          fi

      - name: Build Wasm library
        run: cargo build -p rv64-wasm --target wasm32-unknown-unknown --release

      - name: Test JavaScript API
        run: |
          node tests/public-api.mjs
          node tests/worker-api.mjs

      - name: Assemble library assets
        shell: bash
        run: |
          release_tag="${{ github.event.inputs.release_tag || github.ref_name }}"
          version="${release_tag#v}"
          out="target/library-release"
          bundle="$out/rv64.js-$version"
          mkdir -p "$bundle"
          install -m 0644 web/rv64.js "$bundle/rv64.js"
          install -m 0644 web/rv64.d.ts "$bundle/rv64.d.ts"
          install -m 0644 web/rv64.worker.js "$bundle/rv64.worker.js"
          install -m 0644 target/wasm32-unknown-unknown/release/rv64_wasm.wasm "$bundle/rv64_wasm.wasm"
          install -m 0644 README.md LICENSE "$bundle/"
          tar -C "$out" -czf "$out/rv64.js-$version.tar.gz" "rv64.js-$version"
          cp "$bundle/rv64.js" "$bundle/rv64.d.ts" "$bundle/rv64.worker.js" \
            "$bundle/rv64_wasm.wasm" "$out/"

      - uses: actions/upload-artifact@v4
        with:
          name: library-assets
          path: target/library-release
          if-no-files-found: error
          retention-days: 7

  build-kernels:
    name: Build ${{ matrix.arch }}-${{ matrix.profile }} kernel
    needs: prepare-release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: riscv64
            profile: minimal
            attr: virt-kernel-fast
            image: Image
          - arch: riscv64
            profile: container
            attr: virt-kernel-fast-container
            image: Image
          - arch: x86
            profile: minimal
            attr: v86-kernel
            image: bzImage
          - arch: x86
            profile: container
            attr: v86-kernel-container
            image: bzImage
          - arch: arm64
            profile: minimal
            attr: arm64-kernel
            image: Image
          - arch: arm64
            profile: container
            attr: arm64-kernel-container
            image: Image

    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31

      - name: Build kernel
        env:
          KERNEL_ATTR: ${{ matrix.attr }}
          KERNEL_IMAGE: ${{ matrix.image }}
          KERNEL_NAME: rv64-kernel-${{ matrix.arch }}-${{ matrix.profile }}
        shell: bash
        run: |
          set -euo pipefail
          output="$(nix build --no-link --print-out-paths ".#${KERNEL_ATTR}")"
          test -s "$output/$KERNEL_IMAGE"
          mkdir -p target/kernels
          # The kernel is shipped raw (uncompressed). v86 / rv64
          # emulator adapters read it back out of the 9p filesystem
          # (v86 auto-discovers boot/vmlinuz*; rv64 hardcodes
          # /boot/Image), so the on-disk file has to be raw ELF.
          # GitHub release CDN's HTTPS gzip still applies on the
          # transport layer when the client sends Accept-Encoding:
          # gzip.
          install -m 0644 "$output/$KERNEL_IMAGE" "target/kernels/${KERNEL_NAME}"
          file "target/kernels/${KERNEL_NAME}"

      - uses: actions/upload-artifact@v4
        with:
          name: kernel-${{ matrix.arch }}-${{ matrix.profile }}
          path: target/kernels/rv64-kernel-${{ matrix.arch }}-${{ matrix.profile }}
          if-no-files-found: error
          retention-days: 7

  publish-kernels:
    name: Publish independent kernel assets
    needs: [prepare-release, build-kernels]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: kernel-*
          path: target/kernels
          merge-multiple: true

      - name: Verify and checksum kernels
        shell: bash
        run: |
          set -euo pipefail
          cd target/kernels
          expected=(
            rv64-kernel-riscv64-minimal
            rv64-kernel-riscv64-container
            rv64-kernel-x86-minimal
            rv64-kernel-x86-container
            rv64-kernel-arm64-minimal
            rv64-kernel-arm64-container
          )
          for kernel in "${expected[@]}"; do
            test -s "$kernel"
          done
          test "$(find . -maxdepth 1 -type f | wc -l | tr -d ' ')" -eq "${#expected[@]}"
          sha256sum "${expected[@]}" > KERNELS-SHA256SUMS

      - name: Publish kernel assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          release_tag="${{ github.event.inputs.release_tag || github.ref_name }}"
          gh release upload "$release_tag" target/kernels/* \
            --repo "$GITHUB_REPOSITORY" --clobber

  build-rv64-archive:
    name: Build WANIX rv64 archive
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target

      - name: Build rv64-vm.wasm
        working-directory: integrations/wanix/adapter
        run: |
          GOWORK=off GOOS=js GOARCH=wasm go build \
            -o ../../dist/rv64-vm.wasm .

      - name: Build rv64_wasm.wasm
        run: |
          cargo build -p rv64-wasm --target wasm32-unknown-unknown --release
          cp target/wasm32-unknown-unknown/release/rv64_wasm.wasm \
            integrations/wanix/dist/rv64_wasm.wasm

      - name: Bundle rv64.tgz
        working-directory: integrations/wanix
        run: |
          tar -czf dist/rv64.tgz -C dist rv64-vm.wasm rv64_wasm.wasm \
            -C ../../../web rv64.js

      - name: Inspect archive contents
        working-directory: integrations/wanix
        run: |
          tar -tzf dist/rv64.tgz | sort
          tar -tzf dist/rv64.tgz | grep -qx 'rv64-vm.wasm'
          tar -tzf dist/rv64.tgz | grep -qx 'rv64_wasm.wasm'
          tar -tzf dist/rv64.tgz | grep -qx 'rv64.js'

      - uses: actions/upload-artifact@v4
        with:
          name: wanix-rv64-archive
          path: integrations/wanix/dist/rv64.tgz
          if-no-files-found: error
          retention-days: 7

  publish-rv64-archive:
    name: Publish WANIX rv64 archive
    needs: [prepare-release, build-rv64-archive]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: wanix-rv64-archive
          path: target/release

      - name: Publish rv64.tgz immediately
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          release_tag="${{ github.event.inputs.release_tag || github.ref_name }}"
          gh release upload "$release_tag" target/release/rv64.tgz \
            --repo "$GITHUB_REPOSITORY" --clobber

  publish-library:
    name: Publish rv64.js library assets
    needs: [build-library, publish-rv64-archive]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: library-assets
          path: target/release

      - name: Assemble and verify library release payload
        shell: bash
        run: |
          release_tag="${{ github.event.inputs.release_tag || github.ref_name }}"
          cd target/release
          sha256sum rv64.js rv64.d.ts rv64.worker.js rv64_wasm.wasm \
            "rv64.js-${release_tag#v}.tar.gz" > SHA256SUMS

      - name: Publish library release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          release_tag="${{ github.event.inputs.release_tag || github.ref_name }}"
          gh release upload "$release_tag" \
            target/release/SHA256SUMS \
            target/release/rv64.js \
            target/release/rv64.d.ts \
            target/release/rv64.worker.js \
            target/release/rv64_wasm.wasm \
            "target/release/rv64.js-${release_tag#v}.tar.gz" \
            --repo "$GITHUB_REPOSITORY" --clobber

  build-wanix-rootfs:
    name: Build ${{ matrix.arch }}-${{ matrix.profile }} rootfs
    needs: prepare-release
    runs-on: ubuntu-latest
    timeout-minutes: 240
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        arch: [riscv64, x86, arm64]
        profile: [minimal, crush, python, nodejs, claude, peri, zero, pi, golang, container, container-full]
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: all
      - name: Build rootfs only
        env:
          WANIX_BUILD_PART: rootfs
        run: |
          chmod +x tools/build-wanix-release-assets.sh
          tools/build-wanix-release-assets.sh "${{ matrix.arch }}" "${{ matrix.profile }}" "target/wanix-rootfs/${{ matrix.arch }}-${{ matrix.profile }}"
      - uses: actions/upload-artifact@v4
        with:
          name: wanix-rootfs-${{ matrix.arch }}-${{ matrix.profile }}
          path: target/wanix-rootfs/${{ matrix.arch }}-${{ matrix.profile }}/wanix-linux-*.tgz
          if-no-files-found: error
          retention-days: 7
      - name: Publish guest archive immediately (rootfs)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_tag="${{ github.event.inputs.release_tag || github.ref_name }}"
          gh release upload "$release_tag" target/wanix-rootfs/${{ matrix.arch }}-${{ matrix.profile }}/wanix-linux-*.tgz --repo "$GITHUB_REPOSITORY" --clobber

  build-wanix-overlays:
    name: Build ${{ matrix.arch }} overlay
    needs: prepare-release
    runs-on: ubuntu-latest
    timeout-minutes: 240
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        arch: [riscv64, x86, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: all
      - name: Fetch static busybox binaries
        run: tools/fetch-busybox.sh
      - name: Build overlay only
        env:
          WANIX_BUILD_PART: overlay
        run: |
          chmod +x tools/build-wanix-release-assets.sh
          tools/build-wanix-release-assets.sh "${{ matrix.arch }}" minimal "target/wanix-overlays/${{ matrix.arch }}"
      - uses: actions/upload-artifact@v4
        with:
          name: wanix-overlay-${{ matrix.arch }}
          path: target/wanix-overlays/${{ matrix.arch }}/wanix-overlay-*.tgz
          if-no-files-found: error
          retention-days: 7
      - name: Publish guest archive immediately (overlay)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_tag="${{ github.event.inputs.release_tag || github.ref_name }}"
          gh release upload "$release_tag" target/wanix-overlays/${{ matrix.arch }}/wanix-overlay-*.tgz --repo "$GITHUB_REPOSITORY" --clobber

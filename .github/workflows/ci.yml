name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-assets-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: deploy/release-assets-worker/package-lock.json

      - name: Install release asset Worker dependencies
        working-directory: deploy/release-assets-worker
        run: npm ci

      - name: Validate release asset Worker
        working-directory: deploy/release-assets-worker
        run: npm run check

      - name: Validate release asset Worker bundle
        working-directory: deploy/release-assets-worker
        run: npx wrangler deploy --dry-run

  validate-container-kernels:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31

      - name: Validate container kernel configurations
        run: |
          for kernel in virt-kernel-fast-container v86-kernel-container arm64-kernel-container; do
            nix build --no-link ".#$kernel"
          done

  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Verify pinned Rust toolchain
        run: |
          rustc --version
          cargo clippy --version

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Lint
        run: |
          cargo clippy --workspace --all-targets -- \
            -D warnings \
            -A clippy::unnecessary-map-or \
            -A clippy::manual-is-multiple-of \
            -A clippy::if-same-then-else \
            -A clippy::too-many-arguments \
            -A clippy::question-mark \
            -A clippy::unnecessary-unwrap \
            -A clippy::manual-range-patterns \
            -A clippy::manual-div-ceil \
            -A clippy::unnecessary-cast

      - name: Build guest fixtures
        run: |
          for guest in hello-nostd hello-std fpu-test bench; do
            (cd "guests/$guest" && cargo build --release)
          done

      - name: Test debug workspace
        run: cargo test --workspace

      - name: Test release workspace
        run: cargo test --workspace --release

      - name: Build browser module
        run: cargo build -p rv64-wasm --target wasm32-unknown-unknown --release

      - name: Test self-contained JavaScript harnesses
        run: |
          node tests/public-api.mjs
          node tests/worker-api.mjs
          node tests/site-asset-source.mjs
          node tests/wanix-guest-release-contract.mjs
          node tests/direct-boot.mjs
          node tests/alpine-boot.mjs
          node tests/vs-v86/harness-selftest.mjs
          node tests/vs-v86/amortized-cold-cost-selftest.mjs
          node tests/http-relay.mjs
          node tests/boot-profile-selftest.mjs
          node tests/jit-telemetry-selftest.mjs
          mkdir -p web/images/alpine
          curl --fail --location --retry 3 \
            https://rv64-release-assets.darren-e4d.workers.dev/demo-images-v4/modern-Image \
            --output web/images/alpine/Image
          curl --fail --location --retry 3 \
            https://rv64-release-assets.darren-e4d.workers.dev/demo-images-v4/modern-alpine.ext4 \
            --output web/images/alpine/alpine.ext4
          RV64_UNTIL=ALPINE_READY node examples/boot-linux.mjs
